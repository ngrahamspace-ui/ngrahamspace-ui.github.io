        const decode = value => Uint8Array.from(atob(value), character => character.charCodeAt(0));
        document.getElementById('unlockForm').addEventListener('submit', async event => {
            event.preventDefault();
            const input = document.getElementById('password');
            const button = document.getElementById('unlockButton');
            const message = document.getElementById('message');
            if (!window.crypto?.subtle) {
                message.textContent = 'Please open the HTTPS website in an up-to-date browser to preview it.';
                return;
            }
            button.disabled = true;
            button.textContent = 'Unlocking…';
            input.removeAttribute('aria-invalid');
            message.textContent = '';
            let html;
            try {
                const material = await crypto.subtle.importKey('raw', new TextEncoder().encode(input.value.trim()), 'PBKDF2', false, ['deriveKey']);
                const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: decode(preview.salt), iterations: preview.iterations, hash: 'SHA-256' }, material, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
                const result = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: decode(preview.iv) }, key, decode(preview.data));
                html = new TextDecoder().decode(result);
            } catch {
                message.textContent = 'That password isn’t correct. Please try again.';
                input.setAttribute('aria-invalid', 'true');
                input.select();
                button.disabled = false;
                button.textContent = 'Unlock preview';
                return;
            }
            // Replacing the document also runs its original scripts and load events.
            document.open();
            document.write(html);
            document.close();
        });
