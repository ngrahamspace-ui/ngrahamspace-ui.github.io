<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Save the Date - Belinda & Nick</title>
    <link rel="stylesheet" href="styles/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Cormorant+Garamond:ital@0;1&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Envelope Container -->
        <div class="envelope-wrapper">
            <img src="assets/Black C5 Straight fl.png" alt="Save the Date Envelope" class="envelope" id="envelope">
        </div>

        <!-- Invite Content (Hidden initially) -->
        <div class="invite-content" id="inviteContent">
            <button class="close-btn" id="closeBtn">&times;</button>
            
            <div class="invite-card">
                <img src="assets/Elegant digital wedd.png" alt="Save the Date" class="invite-image">
            </div>
        </div>

        <!-- Background overlay -->
        <div class="overlay" id="overlay"></div>
    </div>

    <script src="scripts/main.js"></script>
</body>
</html>
