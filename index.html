<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Save the Date - Belinda & Nick</title>
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="flip/flip.min.css" />
    <link rel="stylesheet" href="assets/flip-master/tick/tick.core.css">
    <link rel="stylesheet" href="assets/flip-master/dist/tick.view.flip.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Cormorant+Garamond:ital@0;1&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBIrmeT7YnJz5-X5HKkbSnfArZ_WfK_XDI&v=weekly&callback=initMap" async defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
    <div class="page-wrapper">
        <section class="hero-section" data-section="0">
            <div class="container">
                <!-- Top Message -->
                <div class="mail-header">
                    <p class="mail-from">You've got mail from</p>
                    <p class="couple-names-header">BELINDA & NICK</p>
                </div>

                <!-- Envelope Container -->
                <div class="envelope-wrapper">
                    <img src="assets/Black C5 Straight fl.png" alt="Save the Date Envelope" class="envelope" id="envelope">
                    
                    <!-- Click to Open Text with Arrow -->
                    <div class="click-prompt">
                        <p class="click-text">Click to open</p>
                    </div>
                </div>

                <!-- Invite Content (Hidden initially) -->
                <div class="invite-content" id="inviteContent">
                    <div class="invite-card">
                        <img src="assets/Babybreath.png" alt="Baby breath decoration" class="babybreath-decoration" style="transform: scaleX(-1) translate(150px, -200px) rotate(-45deg);">
                        <img src="assets/LighterCard2.png" alt="Save the Date" class="invite-image">
                    </div>
                </div>

                <!-- Background overlay -->
                <div class="overlay" id="overlay"></div>

                <!-- Particle Effect Container -->
                <div id="particleContainer" class="particle-container"></div>

                <!-- Scroll Down Indicator -->
                <div class="scroll-indicator" id="scrollIndicator">
                    <p class="scroll-text">Scroll down</p>
                    <svg class="scroll-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 5v14M5 12l7 7 7-7"/>
                    </svg>
                </div>
            </div>
        </section>

        <!-- Date and Countdown Section -->
        <section class="date-countdown-section" data-section="1">
            <div class="container">
                <!-- Date Display -->
                <div class="date-display">
                    <p class="save-the-date-text">Wednesday 9th June 2027</p>
                </div>

                <!-- Countdown Timer (Flip Clock) - Days Only -->
                <div class="tick tick-days-only" data-did-init="handleMainCountdown">
                    <div data-repeat="true" data-layout="horizontal fit" data-transform="preset(d, h, m, s)">
                        <div class="tick-group">
                            <div data-key="value" data-repeat="true" data-transform="pad(00) -> split -> delay">
                                <span data-view="flip"></span>
                            </div>
                            <span data-key="label" data-view="text" class="tick-label"></span>
                        </div>
                    </div>
                </div>
                

                <!-- Countdown Timer (Flip Clock) - Hours, Minutes, Seconds Only -->
                <div class="tick tick-hms-only" data-did-init="handleMainCountdown">
                    <div data-repeat="true" data-layout="horizontal fit" data-transform="preset(d, h, m, s)">
                        <div class="tick-group">
                            <div data-key="value" data-repeat="true" data-transform="pad(00) -> split -> delay">
                                <span data-view="flip"></span>
                            </div>
                            <span data-key="label" data-view="text" class="tick-label"></span>
                        </div>
                    </div>
                </div>
                
            </div>
        </section>

        <!-- COMMENTED OUT - Venue Intro Section to end of page
        <section class="venue-intro-section">
            <div class="container">
                <p class="venue-location-text">Eastington Park, Gloucestershire</p>
                <div class="venue-image-wrapper">
                    <img src="assets/Venue.jpg" alt="Eastington Park venue" class="venue-intro-image">
                </div>
            </div>
        </section>

        <section class="venue-section">
            <div class="container">
                <div class="venue-content">
                    <div class="venue-address">
                        <p>Eastington Park</p>
                        <p>Gloucestershire</p>
                        <p>GL10 3RY</p>
                    </div>
                    <a href="https://www.eastingtonpark.co.uk/gallery/" class="venue-btn">View This Venue</a>
                    <div class="map-container">
                        <iframe
                            src="https://www.google.com/maps/embed?pb=!1m19!1m8!1m3!1d2470.0942662111493!2d-2.3136003!3d51.7495998!3m2!1i1024!2i768!4f13.1!4m8!3e0!4m0!4m5!1s0x487109f746679a5d%3A0xbf145f5aa0e00283!2sEastington%20Park%2C%20Spring%20Hill%20GL10%203RY!3m2!1d51.7495998!2d-2.3114116!5e0!3m2!1sen!2suk!4v1772652670341!5m2!1sen!2suk"
                            width="100%"
                            height="100%"
                            style="border:0;"
                            allowfullscreen=""
                            loading="lazy"
                            referrerpolicy="no-referrer-when-downgrade">
                        </iframe>
                    </div>
                </div>
            </div>
        </section>

        <section class="accommodation-section">
            <div class="container">
                <div class="accommodation-content">
                    <h2 class="accommodation-title">Places to Stay</h2>
                    <button class="accommodation-btn">Explore Accommodation - No active Link yet</button>
                </div>
            </div>
        </section>

        <section class="password-countdown-section">
            <div class="container">
                <p class="password-countdown-text">Countdown to when the invitation password will be sent</p>
                <div class="tick" data-did-init="handleInviteCountdown">
                    <div data-repeat="true" data-layout="horizontal fit" data-transform="preset(d, h, m, s)">
                        <div class="tick-group">
                            <div data-key="value" data-repeat="true" data-transform="pad(00) -> split -> delay">
                                <span data-view="flip"></span>
                            </div>
                            <span data-key="label" data-view="text" class="tick-label"></span>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section class="rsvp-section">
            <div class="container">
                <div class="rsvp-content">
                    <h2 class="rsvp-title">RSVP</h2>
                    <div class="rsvp-locked" id="rsvpLocked">
                        <input type="password" id="passwordInput" class="password-input" placeholder="Enter password to unlock">
                        <button class="unlock-btn" id="unlockBtn">Unlock</button>
                    </div>
                    <div class="rsvp-unlocked" id="rsvpUnlocked" style="display: none;">
                        <div class="qr-code-container">
                            <img src="assets/Qr-code.png" alt="RSVP QR Code" class="qr-code">
                            <a href="https://bridebook.com/uk/for/belinda-and-nick/rsvp" class="qr-link-btn">RSVP</a>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        -->
    </div>

    <script src="flip/flip.min.js"></script>
    <script src="assets/flip-master/tick/tick.core.global.min.js"></script>
    <script src="assets/flip-master/dist/tick.view.flip.global.min.js"></script>
    <script src="scripts/main.js"></script>
</body>
</html>
