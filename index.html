<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Save the Date - Belinda & Nick</title>
    <link rel="stylesheet" href="styles/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Cormorant+Garamond:ital@0;1&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Top Message -->
        <div class="mail-header">
            <p class="mail-from">You've got mail from</p>
            <p class="couple-names-header">BELINDA & NICK</p>
        </div>

        <!-- Envelope Container -->
        <div class="envelope-wrapper">
            <img src="assets/Black C5 Straight fl.png" alt="Save the Date Envelope" class="envelope" id="envelope">
            
            <!-- Click to Open Text with Arrow -->
            <div class="click-prompt">
                <p class="click-text">Click to open</p>
                <svg class="curved-arrow" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <!-- Curved arrow pointing up -->
                    <path d="M 50 80 Q 30 60 30 40 Q 30 20 50 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    <!-- Arrow head -->
                    <polygon points="50,20 45,30 55,30" fill="currentColor"/>
                </svg>
            </div>
        </div>

        <!-- Invite Content (Hidden initially) -->
        <div class="invite-content" id="inviteContent">
            <button class="close-btn" id="closeBtn">&times;</button>
            
            <div class="invite-card">
                <img src="assets/Elegant digital wedd.png" alt="Save the Date" class="invite-image">
            </div>
        </div>

        <!-- Background overlay -->
        <div class="overlay" id="overlay"></div>
    </div>

    <script src="scripts/main.js"></script>
</body>
</html>
